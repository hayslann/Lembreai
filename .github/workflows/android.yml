name: Testar e gerar APK
on:
  push:
    branches: [main, principal, codex/finish-lembreai-beta]
  workflow_dispatch:

concurrency:
  group: lembreai-android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Criar arquivos nativos Android
        run: flutter create --platforms=android --project-name=lembreai --org=app.lembreai --no-pub .
      - name: Configurar Android
        env:
          ADMOB_APPLICATION_ID: ${{ secrets.ADMOB_APPLICATION_ID }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application', 1)
          s = s.replace('</application>', '''<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/>
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                <intent-filter>
                  <action android:name="android.intent.action.BOOT_COMPLETED"/>
                  <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                </intent-filter>
              </receiver>
            </application>''', 1)
          # Sem backup automatico de texto e agenda em nuvem pelo Android.
          s = s.replace('<application', '<application android:allowBackup="false"', 1)
          # Usa o ID real somente quando o proprietário configurar o segredo; caso
          # contrário, mantém o ID oficial de teste do Google.
          admob_app_id = os.environ.get('ADMOB_APPLICATION_ID', '').strip()
          if not admob_app_id:
              admob_app_id = 'ca-app-pub-3940256099942544~3347511713'
          if not admob_app_id.startswith('ca-app-pub-') or '"' in admob_app_id:
              raise SystemExit('ADMOB_APPLICATION_ID inválido')
          s = s.replace('</application>', f'<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="{admob_app_id}" />\\n</application>', 1)
          p.write_text(s)
          # Usar o ícone oficial da marca em vez do logo Flutter padrão.
          brand_icon = Path('assets/branding/lembreai_logo.png').read_bytes()
          for launcher in Path('android/app/src/main/res').glob('mipmap-*/ic_launcher.png'):
              launcher.write_bytes(brand_icon)
          kts = Path('android/app/build.gradle.kts')
          groovy = Path('android/app/build.gradle')
          if kts.exists():
              s = kts.read_text()
              if 'isCoreLibraryDesugaringEnabled' not in s:
                  s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
              if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:' not in s:
                  s += '\ndependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4") }\n'
              kts.write_text(s)
          elif groovy.exists():
              s = groovy.read_text()
              if 'coreLibraryDesugaringEnabled' not in s:
                  s = s.replace('compileOptions {','compileOptions {\n        coreLibraryDesugaringEnabled true',1)
              if 'coreLibraryDesugaring ' not in s:
                  s += "\ndependencies { coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4' }\n"
              groovy.write_text(s)
          PY
      - name: Dependências
        run: flutter pub get
      - name: Contornar falha do lintVital em plugins Android de terceiros
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = list(Path.home().glob('.pub-cache/hosted/pub.dev/*/android'))
          if not roots:
              raise SystemExit('Nenhum plugin Android encontrado no cache do Flutter.')
          patched = 0
          for root in roots:
              gradle = root / 'build.gradle'
              if not gradle.exists():
                  gradle = root / 'build.gradle.kts'
              if not gradle.exists():
                  continue
              content = gradle.read_text()
              workaround = '\ntasks.configureEach {\n    if (name == "lintVitalAnalyzeRelease") enabled = false\n}\n'
              if 'lintVitalAnalyzeRelease' not in content:
                  gradle.write_text(content + workaround)
                  patched += 1
          print(f'Contorno de lint aplicado a {patched} plugins Android.')
          PY
      - name: Testar interpretação e avisos sonoros
        run: flutter test test/reminder_parser_test.dart test/alert_preferences_test.dart test/plan_catalog_test.dart test/app_update_service_test.dart
      - name: Testar entendimento e segurança da IA
        run: node --test backend/brain.test.mjs backend/cloudflare-worker.test.mjs backend/multimodal.test.mjs backend/commercial-readiness.test.mjs backend/admin.test.mjs backend/reward_policy.test.mjs
      - name: Teste real da conversa com Gemini na Cloudflare
        run: node backend/smoke-live.mjs
      - name: Testar acesso protegido ao painel administrativo
        run: node backend/admin-live-smoke.mjs
      - name: Preparar assinatura persistente do Android
        id: android_signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          present=0
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            [[ -n "$value" ]] && present=$((present + 1))
          done
          if [[ "$present" == 0 ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "Assinatura persistente ausente; este job compilará somente APK de teste." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$present" != 4 ]]; then
            echo "Configure os quatro segredos Android antes de gerar APK atualizável." >&2
            exit 1
          fi
          path="$RUNNER_TEMP/lembreai-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$path"
          chmod 600 "$path"
          keytool -list -keystore "$path" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "stable=true" >> "$GITHUB_OUTPUT"
          echo "ANDROID_KEYSTORE_PATH=$path" >> "$GITHUB_ENV"
      - name: Configurar assinatura persistente no Gradle
        if: ${{ steps.android_signing.outputs.stable == 'true' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          kts = Path('android/app/build.gradle.kts')
          groovy = Path('android/app/build.gradle')
          if kts.exists():
              p = kts
              s = p.read_text()
              signing = '''\n                  create("stableRelease") {
                      storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                  }\n'''
              if 'signingConfigs {' in s:
                  s = s.replace('signingConfigs {', 'signingConfigs {' + signing, 1)
              else:
                  s = s.replace('android {', 'android {\n    signingConfigs {' + signing + '    }\n', 1)
              s, count = re.subn(r'(release\s*\{[\s\S]*?)signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)', r'\1signingConfig = signingConfigs.getByName("stableRelease")', s, count=1)
              if count != 1:
                  raise SystemExit('Não encontrei a assinatura release padrão no Gradle Kotlin.')
          elif groovy.exists():
              p = groovy
              s = p.read_text()
              signing = '''\n                  stableRelease {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }\n'''
              if 'signingConfigs {' in s:
                  s = s.replace('signingConfigs {', 'signingConfigs {' + signing, 1)
              else:
                  s = s.replace('android {', 'android {\n    signingConfigs {' + signing + '    }\n', 1)
              s, count = re.subn(r'(release\s*\{[\s\S]*?)signingConfig\s+signingConfigs\.debug', r'\1signingConfig signingConfigs.stableRelease', s, count=1)
              if count != 1:
                  raise SystemExit('Não encontrei a assinatura release padrão no Gradle Groovy.')
          else:
              raise SystemExit('Arquivo Gradle Android não encontrado.')
          p.write_text(s)
          PY
      - name: Compilar APK
        id: build_apk
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}
          ADMOB_ADS_APPROVED: ${{ secrets.ADMOB_ADS_APPROVED }}
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          # Mantém anúncios de teste até a aprovação do app/conta AdMob.
          # Só use IDs reais depois de criar o secret ADMOB_ADS_APPROVED=true.
          rewarded_ad_unit_id="ca-app-pub-3940256099942544/5224354917"
          if [[ "$ADMOB_ADS_APPROVED" == "true" && -n "$ADMOB_REWARDED_AD_UNIT_ID" ]]; then
            rewarded_ad_unit_id="$ADMOB_REWARDED_AD_UNIT_ID"
          fi
          if [[ "${{ steps.android_signing.outputs.stable }}" == "true" ]]; then
            flutter build apk --release \
              --dart-define=AI_SERVER_URL="https://lembreai-ia.hayslan08.workers.dev" \
              --dart-define=FIREBASE_WEB_API_KEY="$FIREBASE_WEB_API_KEY" \
              --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
              --dart-define=ADMOB_REWARDED_AD_UNIT_ID="$rewarded_ad_unit_id"
            echo "apk_path=build/app/outputs/flutter-apk/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            flutter build apk --debug \
              --dart-define=AI_SERVER_URL="https://lembreai-ia.hayslan08.workers.dev" \
              --dart-define=FIREBASE_WEB_API_KEY="$FIREBASE_WEB_API_KEY" \
              --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
              --dart-define=ADMOB_REWARDED_AD_UNIT_ID="$rewarded_ad_unit_id"
            echo "apk_path=build/app/outputs/flutter-apk/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi
      - name: Instalar e abrir APK em emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          script: |
            set -eu
            adb install -r "${{ steps.build_apk.outputs.apk_path }}"
            adb logcat -c
            adb shell monkey -p app.lembreai.lembreai 1
            sleep 15
            if ! adb shell pidof app.lembreai.lembreai >/dev/null; then
              echo 'LembreAI fechou no emulador. Últimos logs Android:'
              adb logcat -d -t 1200
              exit 1
            fi
            echo 'LembreAI permaneceu aberto no emulador Android.'
      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: LembreAI-APK-teste
          path: ${{ steps.build_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publicar APK de testes com link direto
        if: ${{ steps.android_signing.outputs.stable == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp "${{ steps.build_apk.outputs.apk_path }}" LembreAI.apk
          if gh release view teste-android >/dev/null 2>&1; then
            gh release upload teste-android LembreAI.apk --clobber
          else
            gh release create teste-android LembreAI.apk \
              --title "LembreAI — APK de testes" \
              --notes "Versão básica de testes. Não é a versão publicada na Play Store." \
              --prerelease --target "${GITHUB_SHA}"
          fi
          VERSION_LINE="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          VERSION_NAME="${VERSION_LINE%%+*}"
          VERSION_CODE="${VERSION_LINE##*+}"
          gh release edit teste-android --notes "LembreAI beta. LEMBREAI_VERSION_NAME=${VERSION_NAME} LEMBREAI_VERSION_CODE=${VERSION_CODE}. O Android requer a mesma assinatura para atualizar sem apagar dados."
