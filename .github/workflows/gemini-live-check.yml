name: Testar Gemini online
on:
  push:
    paths:
      - 'backend/cloudflare-worker.mjs'
      - 'backend/brain.mjs'
      - 'backend/smoke-live.mjs'
      - '.github/workflows/gemini-live-check.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verificar conversacao real com Gemini
        run: node backend/smoke-live.mjs
